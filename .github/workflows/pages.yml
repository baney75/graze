name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and check
        run: npm test
      - name: Publish from this workflow, not from the branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api repos/${{ github.repository }}/pages --jq .build_type || true)
          echo "Pages build type: $src"
          if [ "$src" != "workflow" ]; then gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow && echo "Switched Pages to GitHub Actions"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
